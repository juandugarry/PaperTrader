[package]
name = "papertrader"
version = "0.4.2"
edition = "2021"
rust-version = "1.98.1"

[lib]
name = "papertrader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
tauri = { version = "2", optional = true, features = [] }

[[bin]]
name = "papertrader"
path = "src/main.rs"
required-features = ["desktop"]
